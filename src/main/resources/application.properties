spring.application.name=PTIT_CNTT2_IT211_SS10_EX1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_SS10_1?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.show_sql = true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.format_sql = true

logging.file.name=logs/PTIT_CNTT2_IT211_SS10_EX1.log
logging.pattern.console=%d{yyyy-MM-dd hh:mm:ss.SSS} - %-5level - %logger{50} - %msg%n
logging.logback.rollingpolicy.max-file-size=2GB
logging.logback.rollingpolicy.max-history=30
logging.level.root=INFO
logging.level.com.ra.ptit_cntt2_it211_ss10_ex1=INFO